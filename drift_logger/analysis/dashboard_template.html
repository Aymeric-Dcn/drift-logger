<title>Drift Logger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a race engineer's desk in four tabs. Session (what happened), Corners (where and why), Techniques (what works), Progress (over time). */
:root {
  --bg: #eef1f5; --surface: #fbfcfd; --ink: #0f1620; --ink-2: #4c5766; --muted: #7d8794;
  --hair: #dce1e8; --axis: #c3cad4; --accent: #1d5fbf; --accent-wash: #e3ecf8; --good: #0a7d2c; --good-line: #0ca30c;
  --crit: #d03b3b; --serious: #ec835a; --warn: #fab219;
  --a0: #b9c1cc; --a1: #86b6ef; --a2: #3987e5; --a3: #1c5cab; --a4: #0d366b;
  --t-power: #2a78d6; --t-lift: #eb6834; --t-feint: #1baf7a; --t-brake: #eda100; --t-clutch: #e87ba4; --t-transition: #008300; --t-other: #6250d6; --t-handbrake: #e34948; --t-grip: #b9c1cc;
  --p1: #e8590c; --p2: #7048e8; --p3: #0b7f8f;
  --offroad: #e4e9e1; --road: #ccd3dc; --wall: #6f7a89;
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218; --surface: #141b24; --ink: #e8edf3; --ink-2: #b2bccb; --muted: #7f8a99;
    --hair: #243040; --axis: #34404f; --accent: #5b98ec; --accent-wash: #1a2a40; --good: #2fbf5a; --good-line: #2fbf5a;
    --a0: #3e4856; --a1: #1c5cab; --a2: #2a78d6; --a3: #5598e7; --a4: #9ec5f4;
    --t-power: #3987e5; --t-lift: #d95926; --t-feint: #199e70; --t-brake: #c98500; --t-clutch: #d55181; --t-transition: #008300; --t-other: #9085e9; --t-handbrake: #e66767; --t-grip: #3e4856;
    --p1: #ff8a3d; --p2: #9d80fb; --p3: #2bbcd2;
    --offroad: #0e1317; --road: #242d38; --wall: #6b788a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218; --surface: #141b24; --ink: #e8edf3; --ink-2: #b2bccb; --muted: #7f8a99;
  --hair: #243040; --axis: #34404f; --accent: #5b98ec; --accent-wash: #1a2a40; --good: #2fbf5a; --good-line: #2fbf5a;
  --a0: #3e4856; --a1: #1c5cab; --a2: #2a78d6; --a3: #5598e7; --a4: #9ec5f4;
  --t-power: #3987e5; --t-lift: #d95926; --t-feint: #199e70; --t-brake: #c98500; --t-clutch: #d55181; --t-transition: #008300; --t-other: #9085e9; --t-handbrake: #e66767; --t-grip: #3e4856;
  --p1: #ff8a3d; --p2: #9d80fb; --p3: #2bbcd2;
  --offroad: #0e1317; --road: #242d38; --wall: #6b788a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h1 { font-size: 34px; line-height: 1; font-weight: 700; }
h2 { font-size: 21px; line-height: 1.1; }
h3 { font-size: 17px; line-height: 1.15; }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.note { font-size: 12.5px; color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand .sub { color: var(--ink-2); }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.field label, .field .lbl { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
select { font: 500 13.5px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 7px 28px 7px 10px; max-width: 280px; }
select:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; border: 1px solid var(--hair); border-radius: 7px; overflow: hidden; background: var(--surface); }
.seg button { font: 500 12.5px var(--body); color: var(--ink-2); background: transparent; border: 0; padding: 7px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); }
.seg button + button { border-left: 1px solid var(--hair); }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--axis); overflow-x: auto; }
nav.tabs button { font: 600 16px var(--display); letter-spacing: .02em; color: var(--ink-2); background: none; border: 0; padding: 8px 14px 9px; border-bottom: 3px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button .count { font: 500 11px var(--mono); color: var(--muted); margin-left: 6px; }
.tab { display: flex; flex-direction: column; gap: 20px; }

.session-band { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
.session-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline; }
.session-meta h2 { font-size: 24px; }
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-top: 1px solid var(--hair); }
.kpi { padding: 12px 14px 4px 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.kpi + .kpi { padding-left: 14px; border-left: 1px solid var(--hair); }
.kpi .v { font-family: var(--display); font-size: 30px; font-weight: 600; line-height: 1.05; }
.kpi .v small { font-size: 16px; color: var(--ink-2); margin-left: 2px; }
.kpi .l { font-size: 12.5px; color: var(--ink-2); }
.delta { font-family: var(--mono); font-size: 11.5px; }
.delta.up { color: var(--good); } .delta.down { color: var(--crit); } .delta.flat { color: var(--muted); }

.grid-main { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; }
.grid-corner { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.6fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--hair); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.map-box svg { width: 100%; height: auto; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend .ramp { display: inline-flex; align-items: center; gap: 6px; }
.legend .ramp i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; }
.legend .sym { display: inline-flex; align-items: center; gap: 5px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }

.corners { display: flex; flex-direction: column; max-height: 620px; overflow-y: auto; margin: 0 -6px; }
.corner { display: grid; grid-template-columns: 4px 46px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 6px; border-bottom: 1px solid var(--hair); border-radius: 4px; cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: inherit; width: 100%; }
.corner:hover, .corner.hl { background: var(--accent-wash); }
.corner[aria-current="true"] { background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent); }
.corner .stripe { align-self: stretch; border-radius: 2px; background: var(--hair); }
.corner .stripe.s3 { background: var(--crit); } .corner .stripe.s2 { background: var(--serious); } .corner .stripe.s1 { background: var(--warn); } .corner .stripe.s0 { background: var(--good-line); }
.corner .num { font-family: var(--display); font-size: 22px; font-weight: 600; line-height: 1; }
.corner .desc { font-size: 12.5px; color: var(--ink-2); min-width: 0; display: flex; flex-direction: column; }
.corner .desc b { color: var(--ink); font-weight: 600; }
.corner .rate { font-family: var(--display); font-size: 20px; font-weight: 600; text-align: right; line-height: 1; }
.corner .rate small { display: block; font: 400 11px var(--mono); color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 10.5px var(--mono); letter-spacing: .05em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; background: var(--crit); color: #fff; width: fit-content; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
.chip { font-family: var(--mono); font-size: 11px; padding: 2px 6px; border-radius: 99px; border: 1px solid var(--hair); color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.chip .dot, .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }

.coach { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.coach-card { display: flex; flex-direction: column; gap: 10px; }
.coach-card .headline { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.1; text-wrap: balance; }
.coach-card ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; color: var(--ink-2); max-width: 65ch; }
.issue { border-left: 3px solid var(--serious); padding: 2px 0 2px 12px; display: flex; flex-direction: column; gap: 2px; max-width: 70ch; }
.issue b { font-weight: 600; }
.issue span { color: var(--ink-2); font-size: 13.5px; }
.exercise { background: var(--accent-wash); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.exercise .eyebrow { color: var(--accent); }
.older { display: flex; flex-direction: column; gap: 8px; }
.older .row { display: flex; gap: 10px; font-size: 13px; color: var(--ink-2); }

.throttle { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.bandbar { display: flex; gap: 2px; height: 26px; border-radius: 5px; overflow: hidden; }
.bandbar span { display: block; height: 100%; min-width: 2px; }
.bandlegend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
.bandlegend div { display: flex; flex-direction: column; gap: 1px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.bandlegend b { font-family: var(--display); font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.1; }
.bandlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.stabs { display: flex; gap: 22px; flex-wrap: wrap; }
.stabs .big { font-family: var(--display); font-size: 40px; font-weight: 600; line-height: 1; }
.stabs .item { display: flex; flex-direction: column; gap: 3px; max-width: 30ch; }

/* corner detail */
.cd-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
.cd-head .big { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: .9; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--hair); border-bottom: 1px solid var(--hair); }
.tile { padding: 10px 12px 10px 0; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.tile + .tile { padding-left: 12px; border-left: 1px solid var(--hair); }
.tile .v { font-family: var(--display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.tile .l { font-size: 12px; color: var(--ink-2); }
.tile .s { font: 11px var(--mono); color: var(--muted); }
.insights { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.insights li { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 8px; font-size: 13.5px; max-width: 75ch; }
.insights li::before { content: ""; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.cd-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 128px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font-size: 12.5px; }
.bar .track { height: 10px; background: var(--hair); border-radius: 3px; overflow: hidden; position: relative; }
.bar .fill { height: 100%; border-radius: 3px 0 0 3px; }
.bar .val { font-family: var(--mono); font-size: 11.5px; text-align: right; color: var(--ink-2); white-space: nowrap; }
.bar .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
.vs th:not(:first-child), .vs td:not(:first-child) { text-align: right; }
.vs .ok { color: var(--good); } .vs .ko { color: var(--crit); }

.matrix td { text-align: center; }
.matrix .cell { display: inline-block; min-width: 54px; padding: 3px 6px; border-radius: 4px; font: 500 12px var(--mono); }

.multiples { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 22px; }
.mult { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mult .t { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.mult .t span:first-child { font-size: 13px; font-weight: 500; }
.mult svg, .strip svg { width: 100%; height: auto; display: block; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { font-family: var(--mono); font-weight: 500; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { padding: 7px 8px; border-bottom: 1px solid var(--hair); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.l, th.l { text-align: left; }
tr.hov:hover td { background: var(--accent-wash); }
.table-scroll { overflow-x: auto; }
.status { display: inline-flex; align-items: center; gap: 5px; }
.two { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; }
.score { display: inline-block; min-width: 30px; text-align: center; font: 500 11.5px var(--mono); padding: 1px 5px; border-radius: 4px; background: var(--accent-wash); color: var(--accent); }

#tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--surface); font-size: 12px; line-height: 1.45; padding: 7px 9px; border-radius: 6px; max-width: 280px; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
#tip b { font-weight: 600; }
footer { font-size: 12px; color: var(--muted); }

/* replay */
.btn { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--hair); border-radius: 6px; padding: 6px 10px; cursor: pointer; min-width: 34px; line-height: 1.2; }
.btn:hover { border-color: var(--axis); }
.btn[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); border-color: var(--accent); }
.btn.mini { padding: 1px 7px; font-size: 10.5px; min-width: 0; }
.replay { display: flex; flex-direction: column; gap: 10px; }
.rp-stage { position: relative; border-radius: 8px; overflow: hidden; background: var(--offroad); border: 1px solid var(--hair); }
.rp-stage > svg { display: block; width: 100%; height: auto; }
.rp-mini { position: absolute; top: 8px; right: 8px; background: var(--surface); opacity: .94; border: 1px solid var(--hair); border-radius: 6px; padding: 2px; }
.rp-mini svg { display: block; width: 100%; height: auto; }
.rp-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rp-bar input[type=range] { flex: 1 1 180px; min-width: 120px; accent-color: var(--p1); }
.rp-play { min-width: 44px; background: var(--p1); color: #fff; border-color: var(--p1); }
.rp-play:hover { border-color: var(--p1); filter: brightness(1.08); }
.rp-time { font-size: 12px; color: var(--ink-2); min-width: 88px; text-align: right; }
.hud { display: flex; flex-direction: column; gap: 4px; }
.hud-row { display: grid; grid-template-columns: minmax(0, 1.25fr) 74px 74px 52px minmax(0, 2.6fr); gap: 4px 12px; align-items: center; font-size: 12.5px; padding: 4px 0; border-top: 1px solid var(--hair); }
.hud .who { display: flex; align-items: center; gap: 7px; min-width: 0; color: var(--ink-2); }
.hud .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hud .sw, .pchip .sw { display: inline-block; width: 14px; height: 8px; border-radius: 2px; flex: none; }
.hud .read { display: flex; align-items: baseline; gap: 3px; white-space: nowrap; }
.hud .read b { font: 600 21px var(--display); line-height: 1; font-variant-numeric: tabular-nums; }
.hud .read small { font: 10.5px var(--mono); color: var(--muted); }
.gauges { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; white-space: nowrap; gap: 8px; align-items: end; }
.gauge { display: flex; flex-direction: column; gap: 3px; font: 10px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; min-width: 0; }
.gauge .g { height: 8px; background: var(--hair); border-radius: 3px; overflow: hidden; position: relative; }
.gauge .g i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; }
.gauge .g i.thr { background: var(--good-line); } .gauge .g i.brk { background: var(--crit); } .gauge .g i.clu { background: var(--t-clutch); }
.gauge.steer .g i { background: var(--ink-2); }
.gauge.steer .g::after { content: ""; position: absolute; left: 50%; top: -1px; bottom: -1px; width: 1px; background: var(--axis); }
.hbflag { font: 600 9.5px var(--mono); text-transform: uppercase; letter-spacing: .05em; padding: 2px 5px; border-radius: 4px; border: 1px solid var(--hair); color: var(--muted); white-space: nowrap; }
.hbflag.on { background: var(--t-handbrake); border-color: var(--t-handbrake); color: #fff; }
.pass-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { font: 11.5px var(--mono); border: 1px solid var(--hair); border-radius: 99px; padding: 3px 10px; background: none; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.pchip:hover { border-color: var(--axis); }
.pchip[aria-pressed="true"] { border-color: var(--pc); box-shadow: inset 0 0 0 1px var(--pc); color: var(--ink); }
.pchip .sw { background: var(--pc); }

@media (max-width: 980px) {
  .grid-main, .grid-corner, .coach, .two, .throttle, .cd-grid { grid-template-columns: minmax(0, 1fr); }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; padding-left: 0; }
  .multiples { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .corners { max-height: 380px; }
}
@media (max-width: 560px) {
  .kpis, .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi:nth-child(odd), .tile:nth-child(odd) { border-left: 0; padding-left: 0; }
  .kpi:nth-child(even), .tile:nth-child(even) { border-left: 1px solid var(--hair); padding-left: 12px; }
  .bandlegend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .bar { grid-template-columns: 96px minmax(0, 1fr) 56px; }
  h1 { font-size: 28px; }
  .hud-row { grid-template-columns: repeat(3, auto) minmax(0, 1fr); }
  .hud .who { grid-column: 1 / -1; }
  .gauges { grid-column: 1 / -1; }
  .rp-mini { width: 30% !important; }
}
@media (prefers-reduced-motion: no-preference) { .corner { transition: background .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="eyebrow">Assetto Corsa · 峠 · <span data-i18n="telemetry"></span></span>
      <h1>Drift Logger</h1>
      <span class="sub" id="totals"></span>
    </div>
    <div class="filters">
      <div class="field"><label for="f-track" data-i18n="road"></label><select id="f-track"></select></div>
      <div class="field"><label for="f-car" data-i18n="car"></label><select id="f-car"></select></div>
      <div class="field"><label for="f-session" data-i18n="session"></label><select id="f-session"></select></div>
      <div class="field"><span class="lbl" data-i18n="language"></span>
        <div class="seg" role="group" aria-label="Language"><button id="l-fr">FR</button><button id="l-en">EN</button></div></div>

      att.map((a, i) => `<tr class="hov" data-i="${i}"><td class="l mono">${shortDate(history.find(x => x.id === a.sid).date)}</td><td class="l"><span class="status"><span class="dot" style="background:${tcol(a.technique)}"></span>${L().tech[a.technique]}</span></td><td>${fmt(a.entry)} km/h</td><td>${a.brake_dist !== null ? fmt(a.brake_dist) + " m" : cd.noBrake}</td><td>${a.kind === "drift" ? fmt(a.avg_angle) + "°" : "–"}</td><td>${a.lift_pct !== null ? pct(a.lift_pct) : "–"}</td><td><span class="score">${a.score}</span></td><td class="l">${outcomeCell(a.outcome, a.reasons)}</td></tr>`).join("") + `</tbody></table></div>`;

  function highlightPass(i, on) {
    document.querySelectorAll("#corner-map .bg-pass").forEach(p => {

    });
  }
  /* ---------- replay ----------
     The car is drawn in world metres (SVG x = world x, SVG y = world z).
     Heading h: nose direction = (sin h, cos h). In SVG that is rotate(-h) of the local +y axis,
     so the car is drawn nose-up along local +y and placed with translate(x z) rotate(-h).
     Front wheels: delta = -steer / STEER_RATIO in heading terms -> rotate(+steer / ratio) locally.
     Travel direction = h + slip angle -> the velocity arrow is rotate(-slip) locally. */
  const STEER_RATIO = 15, PASS_COLORS = ["var(--p1)", "var(--p2)", "var(--p3)"];
  let players = [], stripCursor = null, sessionPlayer = null;
  const cornerSel = {};
  function stopAll() { players.forEach(p => p.stop()); players = []; sessionPlayer = null; }
  const hasReplay = t => !!(t && t.hd && t.sb);
  const angDiff = (a, b) => ((a - b + 540) % 360) - 180;
  const rateLabel = r => (r === .25 ? "¼" : r === .5 ? "½" : r) + "×";

  function idxAt(t, tt) {
    let lo = 0, hi = t.t.length - 1;
    if (tt <= t.t[0]) return 0;
    if (tt >= t.t[hi]) return hi;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (t.t[m] <= tt) lo = m; else hi = m; }
    return lo;
  }
  function sampleAt(t, tt) {
    const i = idxAt(t, tt), j = Math.min(i + 1, t.t.length - 1);
    const f = j > i && t.seg[i] === t.seg[j] ? Math.min(1, Math.max(0, (tt - t.t[i]) / ((t.t[j] - t.t[i]) || 1))) : 0;
    const lin = k => t[k][i] + (t[k][j] - t[k][i]) * f;
    const sb = lin("sb");
    return { i, x: lin("x"), z: lin("z"), hd: t.hd[i] + angDiff(t.hd[j], t.hd[i]) * f, sb, angle: Math.abs(sb), speed: lin("speed"),
      thr: lin("thr"), brk: lin("brk"), clu: t.clu ? lin("clu") : 1, steer: lin("steer"), gear: t.gear[i], hb: t.hb ? t.hb[f < .5 ? i : j] : 0, pos: t.pos[i] };
  }

  function makeCar(parent, color, opt) {
    opt = opt || {};
    const g = el("g", { class: "car" }, parent);
    let arrow = null, line = null, head = null, fl = null, fr = null;
    if (opt.arrow) {
      arrow = el("g", {}, g);
      line = el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: "var(--ink)", "stroke-width": 1.6, "vector-effect": "non-scaling-stroke", "stroke-linecap": "round" }, arrow);
      head = el("path", { d: "M0 0L-.75 -1.5L.75 -1.5Z", fill: "var(--ink)" }, arrow);
    }
    const inner = el("g", { transform: `scale(${opt.scale || 1})` }, g);
    if (opt.outline) {
      el("rect", { x: -.9, y: -2.25, width: 1.8, height: 4.5, rx: .45, fill: "none", stroke: color, "stroke-width": 1.2, "vector-effect": "non-scaling-stroke" }, inner);
      el("line", { x1: -.7, x2: .7, y1: 1.1, y2: 1.1, stroke: color, "stroke-width": 1.2, "vector-effect": "non-scaling-stroke" }, inner);
    } else {
      el("rect", { x: -.9, y: -2.25, width: 1.8, height: 4.5, rx: .45, fill: color, stroke: "var(--surface)", "stroke-width": 1, "vector-effect": "non-scaling-stroke" }, inner);
      el("rect", { x: -.7, y: .55, width: 1.4, height: .65, rx: .15, fill: "var(--surface)", "fill-opacity": .9 }, inner);
      if (opt.wheels) {
        [-.88, .88].forEach(x => el("rect", { x: x - .15, y: -1.69, width: .3, height: .68, rx: .08, fill: "var(--ink)" }, inner));
        fl = el("g", {}, inner); fr = el("g", {}, inner);
        [fl, fr].forEach(w => el("rect", { x: -.15, y: -.34, width: .3, height: .68, rx: .08, fill: "var(--ink)" }, w));
      }
    }
    return {
      g,
      set(sm, op) {
        g.setAttribute("transform", `translate(${sm.x.toFixed(2)} ${sm.z.toFixed(2)}) rotate(${(-sm.hd).toFixed(1)})`);
        g.setAttribute("opacity", op === undefined ? 1 : op);
        g.removeAttribute("visibility");
        if (fl) {
          const w = (sm.steer / STEER_RATIO).toFixed(1);
          fl.setAttribute("transform", `translate(-.88 1.35) rotate(${w})`);
          fr.setAttribute("transform", `translate(.88 1.35) rotate(${w})`);
        }
        if (arrow) {

        }
      },
      hide() { g.setAttribute("visibility", "hidden"); },
    };
  }

  function makePlayer(bar, opt) {
    const R = L().rp, p = { tau: opt.start ?? opt.t0, rate: opt.rate, playing: false, raf: 0, last: 0 };
    bar.innerHTML = `<button class="btn rp-play"></button><button class="btn" data-a="restart" title="${R.restart}" aria-label="${R.restart}">↺</button>${opt.extraLeft || ""}
      <input type="range" min="${opt.t0}" max="${opt.t1}" step="0.05" aria-label="${R.time}"><span class="rp-time mono"></span>
      <div class="seg" role="group" aria-label="${R.speed}">${opt.rates.map(r => `<button data-r="${r}">${rateLabel(r)}</button>`).join("")}</div>${opt.extraRight || ""}`;
    const btn = bar.querySelector(".rp-play"), rng = bar.querySelector("input"), time = bar.querySelector(".rp-time");
    const sync = () => {
      btn.textContent = p.playing ? "❚❚" : "▶"; btn.setAttribute("aria-label", p.playing ? R.pause : R.play); btn.title = p.playing ? R.pause : R.play;
      bar.querySelectorAll("[data-r]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.r === p.rate));
    };
    const draw = snap => { rng.value = p.tau; time.textContent = opt.timeLabel(p.tau); opt.draw(p.tau, snap); if (opt.after) opt.after(p.tau); };
    const frame = now => {
      if (!p.playing) return;

    sync(); draw(true);

    return p;
  }

  function makeHud(box, rows) {

  function carLegend() {

  /* the road: real edges from the track's AI line when available, else a band around the driven line */
  function roadInto(g, tr, fallback) {
    const e = tr.edges;
    if (!e) { el("polyline", { points: fallback, fill: "none", stroke: "var(--road)", "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" }, g); return; }
    const L = e.l, Rr = e.r, n = Math.min(L.x.length, Rr.x.length);

    [L, Rr].forEach(side => el("polyline", { points: side.x.map((x, i) => x + "," + side.z[i]).join(" "), fill: "none", stroke: "var(--wall)", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round" }, g));
  }

  /* trail coloured by slip angle, in world metres */
  function angleTrail(g, t, width, i0, i1) {
    let run = [], bin = -1, seg = -1;
    const flush = () => { if (run.length > 1) el("polyline", { points: run.join(" "), fill: "none", stroke: `var(${BINS[bin][2]})`, "stroke-width": width, "vector-effect": "non-scaling-stroke", "stroke-linecap": "round", "stroke-linejoin": "round" }, g); };
    for (let i = i0 ?? 0; i <= (i1 ?? t.x.length - 1); i++) {
      const b = binOf(t.angle[i]), p = t.x[i].toFixed(1) + "," + t.z[i].toFixed(1);
      if (b !== bin || t.seg[i] !== seg) { if (t.seg[i] === seg) run.push(p); flush(); run = [p]; bin = b; seg = t.seg[i]; } else run.push(p);
    }
    flush();
  }

  /* ---- whole-session replay: chase camera + mini-map ---- */
  function renderReplay(box, tr, ses) {
    const t = ses.trace, R = L().rp;
    if (!hasReplay(t)) { box.innerHTML = `<p class="note">${R.rerun}</p>`; return; }
    box.innerHTML = `<div class="replay"><div class="rp-stage"><div class="rp-mini"></div></div><div class="rp-bar"></div><div class="hud"></div></div>`;
    const stage = box.querySelector(".rp-stage"), W = 760, H = 420, K = 6;
    const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": R.follow }, null);
    stage.insertBefore(svg, stage.firstChild);
    const world = el("g", {}, svg);
    const refPts = tr.ref_trace.x.map((x, i) => x.toFixed(1) + "," + tr.ref_trace.z[i].toFixed(1)).join(" ");
    roadInto(world, tr, refPts);
    angleTrail(world, t, 3);
    const badges = tr.corners.map(c => {
      const g = el("g", {}, world);
      el("circle", { cx: 0, cy: 0, r: 11, fill: "var(--surface)", stroke: c.stats && c.stats.treacherous ? "var(--crit)" : "var(--ink)", "stroke-width": 1.2 }, g);
      txt(g, 0, 4.5, L().C + c.id, { "text-anchor": "middle", "font-family": "Saira Condensed, Arial Narrow, sans-serif", "font-size": 11.5, "font-weight": 600, fill: "var(--ink)" });
      return { g, c };
    });
    const evs = ses.events.filter(e => e.type !== "lift").map(e => { const g = el("g", {}, world); drawSymbol(g, e.type, 0, 0); return { g, e }; });
    const ghosts = [1, 2, 3, 4, 5].map(() => makeCar(world, "var(--p1)", { outline: true }));
    const car = makeCar(world, "var(--p1)", { wheels: true, arrow: true });

    // mini-map
    const mini = stage.querySelector(".rp-mini");

  function aggTable(id, key, labeler) {
    const groups = {};
    history.forEach(s => (groups[s[key]] = groups[s[key]] || []).push(s));
    const rows = Object.entries(groups).map(([k, ss]) => {
      const km = ss.reduce((a, s) => a + s.distance_km, 0), dr = ss.reduce((a, s) => a + s.drifts, 0);
      const ok = ss.reduce((a, s) => a + (s.clean_pct || 0) * s.drifts, 0) / Math.max(dr, 1);
      const imp = ss.reduce((a, s) => a + (s.impacts_heavy ?? s.impacts), 0), ang = ss.reduce((a, s) => a + (s.avg_angle || 0) * s.drifts, 0) / Math.max(dr, 1);
      return `<tr><td>${labeler(k)}</td><td>${ss.length}</td><td>${fmt(km, 1)}</td><td>${dr}</td><td>${pct(ok)}</td><td>${fmt(ang)}°</td><td>${fmt(imp / Math.max(km, .01), 1)}</td></tr>`;
    });
    $(id).innerHTML = `<thead><tr><th>${key === "car" ? L().car : L().road}</th>${L().agg.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody>`;
  }

  function save() { try { localStorage.setItem("dl-prefs", JSON.stringify({ track: state.track, car: state.car, mode: state.mode, lang: state.lang, tab: state.tab, corner: state.corner, csort: state.csort, cam: state.cam })); } catch (e) {} }
  function renderAll() {
    stopAll();
    renderChrome();
    if (state.tab === "session") { renderBand(); renderCoach(); renderMap(); renderSessionCorners(); renderThrottle(); renderStrip(); renderDrifts(); if (sessionPlayer) sessionPlayer.redraw(); }
    if (state.tab === "corners") { renderCornerList(); renderCornerDetail(); }
    if (state.tab === "techniques") renderTechniques();
    if (state.tab === "progress") { renderEvo(); aggTable("by-car", "car", prettyCar); aggTable("by-track", "track", prettyTrack); }
  }
  document.querySelectorAll("#tabs button").forEach(b => b.addEventListener("click", () => { state.tab = b.dataset.tab; save(); renderAll(); }));
  $("f-track").addEventListener("change", e => { state.track = e.target.value; state.session = null; state.corner = null; save(); renderAll(); });
  $("f-car").addEventListener("change", e => { state.car = e.target.value; state.session = null; save(); renderAll(); });
  $("f-session").addEventListener("change", e => { state.session = e.target.value; renderAll(); });
  $("m-session").addEventListener("click", () => { state.mode = "session"; save(); renderAll(); });
  $("m-cumul").addEventListener("click", () => { state.mode = "cumul"; save(); renderAll(); });
  $("m-replay").addEventListener("click", () => { state.mode = "replay"; save(); renderAll(); });
  $("cs-trouble").addEventListener("click", () => { state.csort = "trouble"; save(); renderAll(); });
  $("cs-order").addEventListener("click", () => { state.csort = "order"; save(); renderAll(); });
  $("l-fr").addEventListener("click", () => { state.lang = "fr"; save(); renderAll(); });
  $("l-en").addEventListener("click", () => { state.lang = "en"; save(); renderAll(); });
  renderAll();
})();
</script>
